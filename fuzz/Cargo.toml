[package]
name = "rustnetconf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace root on purpose: this crate needs nightly and a sanitizer,
# and joining the parent workspace would make `cargo test --workspace` and CI
# depend on both.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rustnetconf]
path = ".."

[dependencies.quick-xml]
version = "0.41"

[[bin]]
name = "fragment_embeds_cleanly"
path = "fuzz_targets/fragment_embeds_cleanly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reply_parser_is_total"
path = "fuzz_targets/reply_parser_is_total.rs"
test = false
doc = false
bench = false
