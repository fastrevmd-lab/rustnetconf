[workspace]
members = [".", "rustnetconf-yang", "rustnetconf-cli"]
resolver = "2"

# Declared here rather than as a crate-root attribute so it covers *every*
# target in each package - build scripts, examples and integration tests are
# separate crates, and `#![forbid(unsafe_code)]` in lib.rs does not reach them.
[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "rustnetconf"
version = "0.17.0"
edition = "2021"
authors = ["fastrevmd-lab"]
description = "An async-first NETCONF 1.0/1.1 client library for Rust"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustnetconf"
keywords = ["netconf", "network", "automation", "ssh", "async"]
categories = ["network-programming"]

[features]
default = []
tls = ["rustls", "tokio-rustls", "webpki-roots"]
# Validate outbound XML fragments by attempting a *conforming* parse, instead of
# by the hand-written rule list in `validate_xml_fragment`. Off by default: it
# costs one small pure-Rust dependency, and #77 is actively trying to shrink the
# graph, so this is the caller's trade to make rather than ours.
strict-validation = ["roxmltree"]

[dependencies]
tokio = { version = "1", features = ["full"] }
russh = { version = "0.62", default-features = false, features = ["flate2", "ring"] }
ring = "0.17"
base64ct = { version = "1", features = ["std"] }
quick-xml = "0.42"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
zeroize = { version = "1", features = ["derive"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
# `default-features = false` and the features named explicitly, because
# Both TLS lines name `aws_lc_rs` deliberately, and both must keep naming the
# same provider: tokio-rustls 0.26's own default set forwards to
# `rustls/aws_lc_rs`, so left at its defaults it silently overrides the
# `default-features = false` above and the provider choice stops being ours.
#
# TLS keeps aws-lc while SSH moves to ring, because ring's default provider has
# neither `X25519MLKEM768` nor `ECDSA_NISTP521_SHA512` -- measured, see
# `src/transport/tls.rs`. `tls` is a non-default feature, so the common build is
# ring-only and gets the whole saving; only a caller who opts into
# NETCONF-over-TLS pays for aws-lc, and they get post-quantum key exchange and
# P-521 for it.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "logging",
    "tls12",
    "aws_lc_rs",
] }
webpki-roots = { version = "0.26", optional = true }
roxmltree = { version = "0.20", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[lints]
workspace = true
