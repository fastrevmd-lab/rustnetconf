[package]
name = "rustnetconf-yang"
version = "0.1.6"
edition = "2021"
authors = ["fastrevmd-lab"]
description = "YANG model code generation for rustnetconf — compile-time config validation"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustnetconf"
keywords = ["yang", "netconf", "network", "codegen"]
categories = ["network-programming"]

[features]
default = ["bundled"]
generated = []
# Compile libyang2 from source. Costs ~44 MB of build artifacts and makes
# `cmake` a hard prerequisite, so it is opt-out: build with
# `--no-default-features` to link a system libyang2 via pkg-config instead.
bundled = ["yang2/bundled"]

[dependencies]
rustnetconf = { version = "0.15", path = ".." }
serde = { version = "1", features = ["derive"] }
quick-xml = "0.41"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
yang2 = "0.18"
