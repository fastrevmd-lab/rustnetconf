[package]
name = "rustnetconf-cli"
version = "0.5.0"
edition = "2021"
authors = ["fastrevmd-lab"]
description = "Terraform-like CLI for declarative NETCONF network config management"
license = "MIT"
repository = "https://github.com/mechubsec/rustnetconf"
keywords = ["netconf", "network", "cli", "automation", "declarative"]

[[bin]]
name = "netconf"
path = "src/main.rs"

[dependencies]
rustnetconf = { version = "0.18.0", path = ".." }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
tokio = { version = "1", features = ["full"] }
console = "0.15"
dialoguer = "0.11"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
